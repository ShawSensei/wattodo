name: wattodo
description: "Wattodo app - iBusinessFormula technical assessment"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  get: ^4.7.2

  # DI
  get_it: ^8.2.0

  # HTTP
  dio: ^5.9.0

  # JSON
  json_annotation: ^4.9.0

  # Local storage
  sqflite: ^2.3.0
  path: ^1.9.0

  # Utilities
  uuid: ^4.5.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.11.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6C63FF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
